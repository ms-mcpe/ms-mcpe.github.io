<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Addons Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #c2185b;
      --primary-rgb: 194, 24, 91;
      --bg: #0d0808;
      --bg-panel: #160b12;
      --bg-card: #1c0e18;
      --surface: #231116;
      --surface-2: #2c141b;
      --text: #ffffff;
      --text-sec: #aaaaaa;
      --text-muted: #777777;
      --border: rgba(var(--primary-rgb), 0.2);
      --border-strong: rgba(var(--primary-rgb), 0.5);
      --ok: #22c55e;
      --warn: #f59e0b;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      --radius: 12px;
      --radius-xs: 6px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg: #f5f5f5;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --surface: #f0f0f0;
      --surface-2: #e5e5e5;
      --text: #121212;
      --text-sec: #555555;
      --text-muted: #888888;
      --border: rgba(var(--primary-rgb), 0.15);
      --border-strong: rgba(var(--primary-rgb), 0.3);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 22px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 9px;
      margin-right: auto;
    }

    .brand i {
      color: var(--primary);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sec);
      cursor: pointer;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition);
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sec);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .chip.on {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .summary {
      font-size: 0.84rem;
      color: var(--text-sec);
      margin-bottom: 12px;
    }

    .summary b {
      color: var(--text);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: var(--transition);
    }

    .row:hover {
      border-color: var(--border-strong);
    }

    .thumb {
      width: 96px;
      height: 58px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface-2);
    }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-url {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      max-width: 100%;
    }

    .row-url.set {
      color: var(--ok);
    }

    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(245, 158, 11, 0.14);
      color: var(--warn);
    }

    .badge.ok {
      background: rgba(34, 197, 94, 0.14);
      color: var(--ok);
    }

    .btn-edit {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-strong);
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-edit:hover {
      filter: brightness(1.15);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sec);
    }

    .empty i {
      font-size: 2.6rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: block;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-hdr-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      margin-right: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-body {
      padding: 18px;
    }

    .modal-foot {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
    }

    .field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 7px;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    .field-input:focus {
      border-color: var(--primary);
    }

    .hint {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 7px;
    }

    .err-msg {
      display: none;
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: var(--radius-xs);
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      font-size: 0.82rem;
    }

    .err-msg.show {
      display: block;
    }

    .btn-primary,
    .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-xs);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      filter: brightness(1.15);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: none;
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text-sec);
    }

    .btn-secondary:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-sec);
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 12px 20px;
      border-radius: var(--radius-xs);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.87rem;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: var(--transition);
      z-index: 80;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.success {
      border-color: var(--ok);
    }

    #toast.error {
      border-color: #ef4444;
    }

    @media (max-width: 640px) {
      .row {
        flex-wrap: wrap;
      }

      .btn-edit {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="wrap topbar-row">
      <div class="brand"><i class="fas fa-cubes"></i> Addons Marketplace</div>
      <button class="icon-btn" id="btn-theme" title="Cambiar tema"><i class="fas fa-moon" id="theme-icon"></i></button>
      <button class="icon-btn" id="btn-reload" title="Recargar"><i class="fas fa-rotate"></i></button>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="search-box">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="search" placeholder="Buscar addon por nombre..." autocomplete="off">
      </div>
      <button class="chip on" id="chip-all">Todos</button>
      <button class="chip" id="chip-empty">Sin URL</button>
      <button class="chip" id="chip-set">Con URL</button>
    </div>

    <div class="summary" id="summary">Cargando...</div>

    <div class="list" id="list">
      <div class="loading">
        <div class="spinner"></div>
        Cargando addons...
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-hdr">
        <div class="modal-hdr-title" id="modal-title">Editar URL</div>
        <button class="icon-btn" id="modal-x"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="input-url">URL del addon</label>
        <input class="field-input" id="input-url" type="url" placeholder="https://nexoadd-ons.tech/mods/mi-addon" autocomplete="off">
        <div class="hint">Ej: https://nexoadd-ons.tech/mods/one-block &nbsp;|&nbsp; Deja vacio para quitarla.</div>
        <p class="err-msg" id="modal-err"></p>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="modal-cancel">Cancelar</button>
        <button class="btn-primary" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyI52B-s7qz8wPMfRXLHaYRDuy1Lq_NfpzEA6IrxcQfKDTXA_TsWmDrfwS6b4L8m7oE9g/exec';
    const THEME_KEY = 'nekocraft_panel_theme';

    let addons = [];
    let filter = 'all';
    let current = null;

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      const icon = document.getElementById('theme-icon');
      if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
    }

    function toggleTheme() {
      const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
      localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
      applyTheme(dark);
    }

    function jsonpGet(params, timeout) {
      timeout = timeout || 25000;
      return new Promise(resolve => {
        const cbName = '_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const timer = setTimeout(() => { cleanup(); resolve(null); }, timeout);
        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cbName] = data => { cleanup(); resolve(data); };
        const script = document.createElement('script');
        const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
        script.src = SCRIPT_URL + '?' + qs + '&callback=' + cbName;
        script.onerror = () => { cleanup(); resolve(null); };
        document.body.appendChild(script);
      });
    }

    async function load() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando addons...</div>';
      document.getElementById('summary').textContent = 'Cargando...';
      let data = await jsonpGet({ action: 'readMarcket' });
      if (!Array.isArray(data)) {
        try {
          const res = await fetch(SCRIPT_URL + '?action=readMarcket');
          data = await res.json();
        } catch (e) { data = []; }
      }
      addons = Array.isArray(data) ? data : [];
      render();
    }

    const PLACEHOLDER = 'https://ms-mcpe.github.io/np';

    function normalize(s) {
      return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function realUrl(a) {
      const u = String(a.url || '').trim();
      return (!u || u.toLowerCase() === PLACEHOLDER) ? '' : u;
    }

    function visible() {
      const q = normalize(document.getElementById('search').value.trim());
      return addons.filter(a => {
        const u = realUrl(a);
        if (filter === 'empty' && u) return false;
        if (filter === 'set' && !u) return false;
        if (q && !normalize(a.nombre).includes(q)) return false;
        return true;
      });
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function safeImg(url) {
      const u = String(url || '').trim();
      if (!/^https?:\/\//i.test(u)) return '';
      return u.replace(/"/g, '%22');
    }

    function render() {
      const list = document.getElementById('list');
      const rows = visible();
      const total = addons.length;
      const set = addons.filter(a => realUrl(a)).length;

      document.getElementById('summary').innerHTML =
        '<b>' + rows.length + '</b> de <b>' + total + '</b> addons &nbsp;·&nbsp; ' +
        '<b>' + (total - set) + '</b> sin URL &nbsp;·&nbsp; <b>' + set + '</b> con URL';

      if (!rows.length) {
        list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>' +
          (total ? 'Ningun addon coincide con la busqueda.' : 'La hoja Marcket todavia no tiene addons.') +
          '</div>';
        return;
      }

      list.innerHTML = rows.map(a => {
        const img = safeImg(a.imagen);
        const url = realUrl(a);
        const thumb = img
          ? '<img class="thumb" src="' + img + '" alt="" loading="lazy" onerror="this.remove()">'
          : '<div class="thumb"></div>';
        return '<div class="row">' + thumb +
          '<div class="row-info">' +
          '<div class="row-name" title="' + esc(a.nombre) + '">' + esc(a.nombre) + '</div>' +
          '<span class="row-url' + (url ? ' set' : '') + '" title="' + esc(url) + '">' +
          (url ? esc(url) : 'Sin URL asignada') + '</span>' +
          (url ? '<span class="badge ok">Listo</span>' : '<span class="badge">Pendiente</span>') +
          '</div>' +
          '<button class="btn-edit" data-f="' + esc(a.fila) + '">' +
          '<i class="fas fa-edit"></i> Editar</button>' +
          '</div>';
      }).join('');
    }

    function openModal(a) {
      current = a;
      document.getElementById('modal-title').textContent = a.nombre;
      document.getElementById('input-url').value = realUrl(a);
      document.getElementById('modal-err').classList.remove('show');
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('input-url').focus(), 50);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
      current = null;
    }

    function showModalErr(msg) {
      const el = document.getElementById('modal-err');
      el.textContent = msg;
      el.classList.add('show');
    }

    async function save() {
      if (!current) return;
      const url = document.getElementById('input-url').value.trim();
      if (url && !/^https?:\/\//i.test(url)) {
        showModalErr('La URL debe empezar por http:// o https://');
        return;
      }
      const btn = document.getElementById('modal-save');
      const html = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'editMarcketUrl', fila: current.fila, id: current.id, nombre: current.nombre, url: url })
        });
        const txt = (await res.text()).trim();
        if (txt === 'EDIT_OK') {
          current.url = url;
          closeModal();
          toast('URL guardada.', 'success');
          render();
        } else if (txt === 'BAD_URL') {
          showModalErr('La URL debe empezar por http:// o https://');
        } else if (txt === 'NOT_FOUND') {
          showModalErr('No se encontro el addon en la hoja Marcket.');
        } else if (txt === 'SHEET_NOT_FOUND') {
          showModalErr('La hoja Marcket no existe todavia. Ejecuta el extractor.');
        } else {
          showModalErr('Error al guardar: ' + txt);
        }
      } catch (e) {
        showModalErr('Error de conexion.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = html;
      }
    }

    let toastTimer = null;

    function toast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = type || '';
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    document.getElementById('search').addEventListener('input', render);

    document.getElementById('chip-all').addEventListener('click', () => setFilter('all'));
    document.getElementById('chip-empty').addEventListener('click', () => setFilter('empty'));
    document.getElementById('chip-set').addEventListener('click', () => setFilter('set'));

    function setFilter(f) {
      filter = f;
      ['all', 'empty', 'set'].forEach(k => {
        document.getElementById('chip-' + k).classList.toggle('on', k === f);
      });
      render();
    }

    document.getElementById('btn-theme').addEventListener('click', toggleTheme);
    document.getElementById('btn-reload').addEventListener('click', load);

    document.getElementById('list').addEventListener('click', e => {
      const btn = e.target.closest('.btn-edit');
      if (!btn) return;
      const fila = parseInt(btn.dataset.f, 10);
      const a = addons.find(x => parseInt(x.fila, 10) === fila);
      if (a) openModal(a);
    });

    document.getElementById('modal-x').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-save').addEventListener('click', save);
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById('input-url').addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') closeModal();
    });

    applyTheme(localStorage.getItem(THEME_KEY) !== 'light');
    load();
  </script>
</body>

</html>
